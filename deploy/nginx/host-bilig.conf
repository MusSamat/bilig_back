# Server (host) nginx: TLS for Bilig, in front of the `web` container on
# 127.0.0.1:8081. Put it in /etc/nginx/sites-available/bilig, link it into
# sites-enabled, replace the server name, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bilig.203-0-113-5.sslip.io
# certbot adds the 443 server block and the certificate paths itself.
server {
  listen 80;
  listen [::]:80;
  server_name bilig.203-0-113-5.sslip.io;

  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Assistant answers stream (SSE).
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
