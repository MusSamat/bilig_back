# nginx inside the `web` container: the SPA plus a proxy to the API.
# TLS is terminated in front of it (host nginx or Caddy, see README.md).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 50m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json application/wasm;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # API and the content CDN stand-in (hash-addressed GLBs, thumbnails).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Assistant answers stream (SSE): no buffering, long reads.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /cdn/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Hashed build assets: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # The service worker and the app shell must always be fresh.
  location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Client-side routes (/ru/bio/..., /admin/...).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
