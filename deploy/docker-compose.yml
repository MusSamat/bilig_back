# Bilig production stack: its own PostgreSQL, Redis, API and site. It lives
# beside other projects on the same server: only the site is published, on a
# loopback port (BILIG_HTTP_PORT, default 8081), behind the server's TLS proxy.
# Database and Redis have no host ports at all.
#
#   cd bilig_back && docker compose -f deploy/docker-compose.yml --env-file deploy/production.env up -d --build
#
# Expects bilig_ft next to bilig_back (../bilig_ft); deploy.sh does all of this.
name: bilig

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bilig
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/production.env}
      POSTGRES_DB: bilig
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bilig -d bilig']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: production.env
    environment:
      NODE_ENV: production
      STORAGE: prisma
      DATABASE_URL: postgresql://bilig:${POSTGRES_PASSWORD}@postgres:5432/bilig
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: ${BILIG_URL:?set BILIG_URL in deploy/production.env}
      APP_URL: ${BILIG_URL}
      ADMIN_URL: ${BILIG_URL}/admin
      CORS_ORIGIN: ${BILIG_URL}
      TRUST_PROXY: 'true'
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - storage:/data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  web:
    build:
      context: ../../bilig_ft
      dockerfile: ../bilig_back/deploy/web.Dockerfile
      additional_contexts:
        bilig_back_deploy: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BILIG_HTTP_PORT:-8081}:80'
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  storage:

networks:
  internal:
