# Local infrastructure for bilig_back. Host ports are deliberately unusual
# (55433 / 56379) so they never clash with other projects' containers.
services:
  postgres:
    image: postgres:16
    container_name: bilig_postgres
    environment:
      POSTGRES_USER: bilig
      POSTGRES_PASSWORD: bilig
      POSTGRES_DB: bilig
    ports:
      - '55433:5432'
    volumes:
      - bilig_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bilig -d bilig']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    container_name: bilig_redis
    ports:
      - '56379:6379'
    volumes:
      - bilig_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  bilig_pgdata:
  bilig_redisdata:
